<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- * ============== FontAwsome ================ -->
    <link rel="stylesheet" href="./css/all.min.css" />
    <!-- * ============== Bootstrap ================ -->
    <link rel="stylesheet" href="./css/bootstrap.min.css" />
    <!-- * ============== main stylesheet ================ -->
    <link rel="stylesheet" href="css/style.css" />
    <!-- * ============== media query ================ -->
    <link rel="stylesheet" href="css/media.css" />
    <link
      rel="shortcut icon"
      href="./images/favicon (1).png"
      type="image/x-icon"
    />
    <title>What's For Dinner</title>

  <body>
    <!--^ ====================== NavBar ======================= -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary py-3 bg-black">
      <div class="container">
        <div class="brand d-flex gap-2 align-items-center">
          <div class="brand-icon rounded-circle position-relative">
            <i
              class="fa-solid fa-utensils text-white fs-5 position-absolute top-50 start-50 translate-middle"
            ></i>
          </div>
          <div class="head">
            <h1 class="navbar-brand fw-bold fs-4 my-0 py-0">
              What's For Dinner
            </h1>

            <span class="fw-light">Your daily meal inspiration</span>
          </div>
        </div>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0 gap-2 align-items-center">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#"
                ><i class="fa-solid fa-bookmark fs-5"></i
              ></a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#"
                ><i class="fa-solid fa-clock-rotate-left fs-5"></i
              ></a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#"
                ><i class="fa-solid fa-gear fs-5"></i
              ></a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">
                <img src="./images/imgi_1_avatar-4.jpg" alt="personal image"
              /></a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <main>
      <!-- !==================== Meal Section ======================= -->
      <section class="meal-section py-5" id="meal-section">
        <div class="container" id="mealContianer"></div>
      </section>
    </main>

    <!-- *===========  Mina js file================ -->
    <script src="js/main.js"></script>
    <!-- *===========  Boostrap bundle ================ -->
    <script src="js/bootstrap.bundle.min.js"></script>

</html>
